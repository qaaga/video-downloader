<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Video Downloader</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; }
        input, button { padding: 10px; margin: 10px; width: 80%; max-width: 400px; }
    </style>
</head>
<body>
    <h2>Download Videos from YouTube, TikTok, Facebook, Instagram, Twitter</h2>
    <input type="text" id="videoUrl" placeholder="Enter video URL here" />
    <button onclick="downloadVideo()">Download</button>
    <p id="result"></p>
    
    <script>
        function cleanURL(url) {
            return url.split("?")[0]; // URL থেকে ? এর পরের অংশ রিমুভ করে ক্লিন করে
        }

        function downloadVideo() {
            let url = document.getElementById('videoUrl').value.trim();
            url = cleanURL(url); // লিংক ক্লিন করা

            if (url.includes("youtube.com") || url.includes("youtu.be")) {
                window.open(https://ytmp4.io/en/?url=${url}, '_blank');
            } else if (url.includes("tiktok.com")) {
                window.open(https://snaptik.app/${url}, '_blank');
            } else if (url.includes("facebook.com")) {
                window.open(https://fdown.net/${url}, '_blank');
            } else if (url.includes("instagram.com")) {
                window.open(https://igram.io/${url}, '_blank');
            } else if (url.includes("twitter.com") || url.includes("x.com")) {
                window.open(https://twdown.net/${url}, '_blank');
            } else {
                document.getElementById('result').innerText = "Invalid URL. Please enter a valid video link.";
            }
        }
    </script>
</body>
</html>
